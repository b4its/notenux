services:
  app:
    image: notenux-app:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: ${COMPOSE_PROJECT_NAME:-notenux}-app
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-notenux}
      - DB_USERNAME=${DB_USERNAME:-notenux}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - notenux-network

  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-notenux}-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18588}:80"
      - "127.0.0.1:${VITE_PORT:-39001}:5173"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - notenux-network

  db:
    image: mysql:8.4.13
    container_name: ${COMPOSE_PROJECT_NAME:-notenux}-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --local-infile=0
      - --skip-name-resolve
      - --innodb-buffer-pool-size=256M
      - --innodb-log-buffer-size=16M
      - --max-connections=200
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-notenux}
      MYSQL_USER: ${DB_USERNAME:-notenux}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${DB_PORT:-39285}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - notenux-network

  phpmyadmin:
    image: phpmyadmin:latest
    profiles: [tools]
    container_name: ${COMPOSE_PROJECT_NAME:-notenux}-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
    ports:
      - "127.0.0.1:${PMA_PORT:-20001}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - notenux-network

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-notenux}-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-37547}:6379"
    volumes:
      - redis_data:/data
    networks:
      - notenux-network

networks:
  notenux-network:
    driver: bridge

volumes:
  db_data:
  redis_data:
