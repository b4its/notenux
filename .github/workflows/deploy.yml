name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST != '' && secrets.HOSTINGER_HOST || '82.180.152.46' }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT != '' && secrets.HOSTINGER_PORT || '65002' }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER != '' && secrets.HOSTINGER_USER || 'u916682966' }}
      TARGET_PATH: /home/u916682966/domains/notenux.oryphem.com/notenux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Setup SSH Connection
        env:
          SSH_KEY_RAW: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "${SSH_KEY_RAW}" ]; then
            echo "Processing SSH Deploy Key..."
            python3 -c "
import os
raw = os.environ.get('SSH_KEY_RAW', '')
lines = [l.strip() for l in raw.strip().replace('\r', '').splitlines() if l.strip()]
body = [l for l in lines if not l.startswith('-----BEGIN') and not l.startswith('-----END')]
key = '-----BEGIN OPENSSH PRIVATE KEY-----\n' + '\n'.join(body) + '\n-----END OPENSSH PRIVATE KEY-----\n'
path = os.path.expanduser('~/.ssh/deploy_key')
with open(path, 'w') as f:
    f.write(key)
os.chmod(path, 0o600)
"
            if ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
              echo "SSH deploy key successfully validated!"
              echo "SSH_AUTH_METHOD=key" >> $GITHUB_ENV
            else
              echo "::error::SSH key could not be validated by ssh-keygen. Please check the secret format."
              exit 1
            fi
          elif [ -n "${SSH_PASS}" ]; then
            echo "Using SSH Password Authentication"
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            echo "SSH_AUTH_METHOD=password" >> $GITHUB_ENV
          else
            echo "::error::Neither HOSTINGER_SSH_KEY nor HOSTINGER_SSH_PASSWORD secret is configured in repository secrets."
            exit 1
          fi

      - name: Sync Frontend Build to Hostinger
        run: |
          SSH_OPTS="-p ${HOSTINGER_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          if [ "${SSH_AUTH_METHOD}" = "key" ]; then
            rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key ${SSH_OPTS}" public/build/ "${HOSTINGER_USER}@${HOSTINGER_HOST}:${TARGET_PATH}/public/build/"
          else
            sshpass -p "${{ secrets.HOSTINGER_SSH_PASSWORD }}" rsync -avz --delete -e "ssh ${SSH_OPTS}" public/build/ "${HOSTINGER_USER}@${HOSTINGER_HOST}:${TARGET_PATH}/public/build/"
          fi

      - name: Execute Server Deployment
        run: |
          REMOTE_COMMAND="bash /home/u916682966/domains/notenux.oryphem.com/deploy.sh"
          SSH_OPTS="-p ${HOSTINGER_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          if [ "${SSH_AUTH_METHOD}" = "key" ]; then
            ssh -i ~/.ssh/deploy_key ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" "${REMOTE_COMMAND}"
          else
            sshpass -p "${{ secrets.HOSTINGER_SSH_PASSWORD }}" ssh ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" "${REMOTE_COMMAND}"
          fi

      - name: Health Check
        run: |
          echo "Verifying application availability..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://notenux.oryphem.com/up)
          if [ "$STATUS" -eq 200 ]; then
            echo "Deployment verified successfully! HTTP Status: 200"
          else
            echo "Health check warning: HTTP Status is $STATUS"
            exit 1
          fi
