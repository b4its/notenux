name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST != '' && secrets.HOSTINGER_HOST || '82.180.152.46' }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT != '' && secrets.HOSTINGER_PORT || '65002' }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER != '' && secrets.HOSTINGER_USER || 'u916682966' }}
      TARGET_PATH: /home/u916682966/domains/notenux.oryphem.com/notenux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Setup SSH Tools
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          if [ -n "${SSH_KEY}" ]; then
            printf "%s\n" "${SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          fi

      - name: Deploy Assets & Run Server Setup
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          SSH_OPTS="-p ${HOSTINGER_PORT} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          REMOTE_COMMAND="bash /home/u916682966/domains/notenux.oryphem.com/deploy.sh"

          if [ -f ~/.ssh/deploy_key ] && ssh -i ~/.ssh/deploy_key ${SSH_OPTS} -o BatchMode=yes "${HOSTINGER_USER}@${HOSTINGER_HOST}" "true" 2>/dev/null; then
            echo "SSH key authentication successful. Syncing assets..."
            rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key ${SSH_OPTS}" public/build/ "${HOSTINGER_USER}@${HOSTINGER_HOST}:${TARGET_PATH}/public/build/"
            echo "Executing remote deployment script..."
            ssh -i ~/.ssh/deploy_key ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" "${REMOTE_COMMAND}"
          else
            echo "Falling back to SSH password authentication. Syncing assets..."
            sshpass -p "${SSH_PASS}" rsync -avz --delete -e "ssh ${SSH_OPTS}" public/build/ "${HOSTINGER_USER}@${HOSTINGER_HOST}:${TARGET_PATH}/public/build/"
            echo "Executing remote deployment script..."
            sshpass -p "${SSH_PASS}" ssh ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" "${REMOTE_COMMAND}"
          fi

      - name: Health Check
        run: |
          echo "Verifying application availability..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://notenux.oryphem.com/up)
          if [ "$STATUS" -eq 200 ]; then
            echo "Deployment verified successfully! HTTP Status: 200"
          else
            echo "Health check warning: HTTP Status is $STATUS"
            exit 1
          fi
