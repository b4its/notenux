name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    env:
      HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST != '' && secrets.HOSTINGER_HOST || '82.180.152.46' }}
      HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT != '' && secrets.HOSTINGER_PORT || '65002' }}
      HOSTINGER_USER: ${{ secrets.HOSTINGER_USER != '' && secrets.HOSTINGER_USER || 'u916682966' }}
      TARGET_PATH: /home/u916682966/domains/notenux.oryphem.com/notenux

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, dom, xml
          coverage: none
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit PHP Dependencies
        run: composer audit

      - name: Prepare Test Environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Test Laravel
        run: php artisan test --compact

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Audit NPM Dependencies
        run: npm audit

      - name: Test JavaScript
        run: npm test

      - name: Build Production Assets
        run: |
          for i in 1 2 3; do
            echo "Attempt $i: Building production assets..."
            if npm run build; then
              echo "Build succeeded on attempt $i"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "Build failed after 3 attempts."
              exit 1
            fi
            echo "Build failed, retrying in 3 seconds..."
            sleep 3
          done

      - name: Setup SSH Tools
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
        run: |
          if [ -z "${HOSTINGER_KNOWN_HOSTS}" ]; then
            echo "HOSTINGER_KNOWN_HOSTS must contain the verified SSH host public key. Deployment aborted."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          printf '%s\n' "${HOSTINGER_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ -n "${SSH_KEY}" ]; then
            printf "%s\n" "${SSH_KEY}" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          fi

      - name: Deploy Assets & Run Server Setup
        env:
          SSH_PASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          SSH_OPTS="-p ${HOSTINGER_PORT} -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          REMOTE_COMMAND="bash /home/u916682966/domains/notenux.oryphem.com/deploy.sh"

          if [ -f ~/.ssh/deploy_key ] && ssh -i ~/.ssh/deploy_key ${SSH_OPTS} -o BatchMode=yes "${HOSTINGER_USER}@${HOSTINGER_HOST}" "true" 2>/dev/null; then
            echo "SSH key authentication successful. Syncing assets..."
            rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key ${SSH_OPTS}" public/build/ "${HOSTINGER_USER}@${HOSTINGER_HOST}:${TARGET_PATH}/public/build/"
            echo "Executing remote deployment script..."
            ssh -i ~/.ssh/deploy_key ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" "${REMOTE_COMMAND}"
          else
            if [ -z "${SSH_PASS}" ]; then
              echo "SSH key authentication failed and no password was configured. Deployment aborted."
              exit 1
            fi
            echo "Falling back to SSH password authentication. Syncing assets..."
            export SSHPASS="${SSH_PASS}"
            sshpass -e rsync -avz --delete -e "ssh ${SSH_OPTS}" public/build/ "${HOSTINGER_USER}@${HOSTINGER_HOST}:${TARGET_PATH}/public/build/"
            echo "Executing remote deployment script..."
            sshpass -e ssh ${SSH_OPTS} "${HOSTINGER_USER}@${HOSTINGER_HOST}" "${REMOTE_COMMAND}"
          fi

      - name: Health Check
        run: |
          echo "Verifying application availability..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://notenux.oryphem.com/up || echo "000")
            if [ "$STATUS" -eq 200 ]; then
              echo "Deployment verified successfully! HTTP Status: 200"
              exit 0
            fi
            echo "Attempt $i: HTTP Status $STATUS, waiting 2s..."
            sleep 2
          done
          echo "Health check warning: HTTP Status did not return 200"
          exit 1
